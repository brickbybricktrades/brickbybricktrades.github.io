<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authorization received - market-updates</title>
<style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;line-height:1.6;color:#1a1a1a}textarea{width:100%;height:6rem;font-size:1rem;box-sizing:border-box}</style></head>
<body>
<h1>Authorization received</h1>
<p id="msg">You can close this tab and return to the setup instructions.</p>
<textarea id="code" readonly style="display:none"></textarea>
<script>
var p=new URLSearchParams(location.search), c=p.get("code");
if(c){
  document.getElementById("msg").textContent="Copy this one-time code and paste it into the TikTok login workflow in GitHub. It works only once and expires in a few minutes.";
  var t=document.getElementById("code"); t.value=c; t.style.display="block"; t.onclick=function(){t.select();};
} else if(p.get("error")){
  document.getElementById("msg").textContent="TikTok returned an error: "+(p.get("error_description")||p.get("error"));
}
</script>
</body></html>
