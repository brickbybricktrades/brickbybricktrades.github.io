<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect TikTok - market-updates</title>
<style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;line-height:1.6;color:#1a1a1a}input{width:100%;padding:.6rem;font-size:1rem;box-sizing:border-box}button{margin-top:1rem;padding:.7rem 1.2rem;font-size:1rem;cursor:pointer}</style></head>
<body>
<h1>Connect TikTok</h1>
<p>One-time login for the owner of the market-updates app. Paste the app's Client key (it is shown in the URL on the next screen, so it is not secret), then log in with TikTok.</p>
<label for="k">Client key</label>
<input id="k" autocomplete="off">
<button id="go">Log in with TikTok</button>
<p><a href="index.html">Home</a> | <a href="privacy.html">Privacy policy</a> | <a href="terms.html">Terms</a></p>
<script>
document.getElementById("go").onclick=function(){
  var k=document.getElementById("k").value.trim();
  if(!k){return;}
  var u="https://www.tiktok.com/v2/auth/authorize/?client_key="+encodeURIComponent(k)+
    "&scope="+encodeURIComponent("user.info.basic,video.upload")+
    "&response_type=code&redirect_uri="+encodeURIComponent("https://brickbybricktrades.github.io/callback.html")+
    "&state="+Math.random().toString(36).slice(2);
  location.href=u;
};
</script>
</body></html>
